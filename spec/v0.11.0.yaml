      IMPULSE_ATTR_TYPE_INTERVAL_SEC_32: 0x0D
      IMPULSE_ATTR_TYPE_INTERVAL_MS_64: 0x0E
      IMPULSE_ATTR_TYPE_BOOL: 0x0F

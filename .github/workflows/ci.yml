name: Impulse Graph Specification & Opcode Coverage CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-spec-and-vectors:
    name: Validate Spec & Enforce 100% Opcode Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout impulse-graph-spec
        uses: actions/checkout@v4

      - name: Checkout impulse-graph-core
        uses: actions/checkout@v4
        with:
          repository: impulse-graph/impulse-graph-core
          path: impulse-graph-core
          ref: main

      - name: Build Impulse Graph Core C-ABI Shared Library
        run: |
          cd impulse-graph-core/impulse-cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build build -j$(nproc)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml pytest

      - name: Verify Specification YAML Syntax
        run: |
          if [ -f spec/v0.9.0.yaml ]; then
            python -c "import yaml; yaml.safe_load(open('spec/v0.9.0.yaml'))"
            echo "SUCCESS: spec/v0.9.0.yaml is valid YAML"
          else
            echo "ERROR: spec/v0.9.0.yaml not found!"
            exit 1
          fi

      - name: Run Opcode Assembly Test Harness Suite
        env:
          IMPULSE_LIB_PATH: ${{ github.workspace }}/impulse-graph-core/impulse-cpp/build/libimpulse_graph.so
        run: |
          python tools/run_vm_asm_suite.py


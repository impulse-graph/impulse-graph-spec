name: Impulse Graph Specification & Opcode Coverage CI

on:
  push:
    branches: [ main, dev, 'feat/v0.11.0-ISA-Refactor' ]
  pull_request:
    branches: [ main, 'feat/v0.11.0-ISA-Refactor' ]

permissions:
  contents: read

jobs:
  validate-spec-and-vectors:
    name: Validate Spec & Enforce 100% Opcode Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout impulse-graph-spec
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml pytest

      - name: Verify Specification YAML
        run: |
          if [ -f spec/v0.11.0.yaml ] && [ -f spec/v0.10.0.yaml ] && [ -f spec/v0.9.0.yaml ]; then
            python -c "import yaml; yaml.safe_load(open('spec/v0.11.0.yaml')); yaml.safe_load(open('spec/v0.10.0.yaml')); yaml.safe_load(open('spec/v0.9.0.yaml'))"
            echo "SUCCESS: spec/v0.11.0.yaml, spec/v0.10.0.yaml, and spec/v0.9.0.yaml are valid"
          else
            echo "ERROR: spec/v0.11.0.yaml, spec/v0.10.0.yaml, or spec/v0.9.0.yaml not found!"
            exit 1
          fi

      - name: Validate ImpulseVM v0.11.0 Freeze, Codegen Drift, GFM Lint & Exhaustive M0 Suite
        run: |
          python tools/isa_loader.py
          python tools/gen_isa_tables.py --check
          python tools/lint_gfm.py
          python -m unittest -v tools/test_isa_m0.py


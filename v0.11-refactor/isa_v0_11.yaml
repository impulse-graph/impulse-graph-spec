# Normative Machine-Readable Specification for ImpulseVM v0.11.0 (impOps v0.11)
# Single source of truth for C++20, Rust, Java 25, OCaml, and Python assembler/fuzzer codegen.

schema_version: 1
isa_name: impOps
isa_version: "0.11.0"
impb_magic: 0x494D5042
impb_version_u16: 11

word_format:
  primary_bits: 64
  endianness: little
  fields:
    opcode:   { bit_lo: 0,  bit_hi: 7,  width: 8 }
    subop:    { bit_lo: 8,  bit_hi: 11, width: 4 }
    flags:    { bit_lo: 12, bit_hi: 15, width: 4 }
    s1:       { bit_lo: 16, bit_hi: 19, width: 4 }
    dst:      { bit_lo: 20, bit_hi: 23, width: 4 }
    s3:       { bit_lo: 24, bit_hi: 27, width: 4 }
    s2:       { bit_lo: 28, bit_hi: 31, width: 4 }
    imm16_lo: { bit_lo: 32, bit_hi: 47, width: 16 }
    imm16_hi: { bit_lo: 48, bit_hi: 63, width: 16 }
    imm32:    { bit_lo: 32, bit_hi: 63, width: 32 }
  extension_word_2:
    guard_opcode: 0xFF
    ext_meta24: { bit_lo: 8,  bit_hi: 31, width: 24, mbz: true }
    imm32_hi:   { bit_lo: 32, bit_hi: 63, width: 32 }

register_banks:
  R:
    count: 16
    prefix: "R"
    description: "64-bit untagged scalar registers paired with uint16_t r_valid_mask"
  F:
    count: 16
    prefix: "F"
    morsel_alias: { range: [8, 15], prefix: "MF", prebound: { 8: "active_mask" } }
    description: "Domain-tagged 3-tier 1-bit and multi-lane (W=8..64) frontiers"
  V:
    count: 16
    prefix: "V"
    morsel_alias:
      range: [8, 15]
      prefix: "M"
      prebound: { 8: "src_or_node_id", 9: "tgt_id", 10: "edge_idx", 11: "lane_mask" }
    description: "Typed off-heap columnar and scratch vectors with Arrow validity bitmasks"

modifier_flags:
  FLAG_MASKED_S3:  { nibble_mask: 0x1, byte1_mask: 0x10, suffix: "mask" }
  FLAG_SCALAR_RHS: { nibble_mask: 0x2, byte1_mask: 0x20, suffix: "scalar" }
  FLAG_ACCUM:      { nibble_mask: 0x4, byte1_mask: 0x40, suffix: "accum" }
  FLAG_EXTENDED:   { nibble_mask: 0x8, byte1_mask: 0x80, suffix: "ext" }

vm_condition_flags:
  ZF: { bit: 0, mask: 0x0001, description: "Zero / Empty / False-or-Null" }
  ST: { bit: 1, mask: 0x0002, description: "Stable / Fixed-Point Converged" }
  NF: { bit: 2, mask: 0x0004, description: "Kleene NULL Scalar Output" }

status_codes:
  0:  IMPULSE_VM_OK
  1:  IMPULSE_VM_ERR_INVALID_OPCODE
  2:  IMPULSE_VM_ERR_OUT_OF_BOUNDS
  3:  IMPULSE_VM_ERR_NULL_SNAPSHOT
  4:  IMPULSE_VM_ERR_STACK_OVERFLOW
  5:  IMPULSE_VM_ERR_STACK_UNDERFLOW
  6:  IMPULSE_VM_ERR_INVALID_OPERAND
  7:  IMPULSE_VM_ERR_USER_THROW
  8:  IMPULSE_VM_ERR_ASSERTION_FAILED
  9:  IMPULSE_VM_ERR_TRAP
  10: IMPULSE_VM_ERR_DOMAIN_MISMATCH
  11: IMPULSE_VM_ERR_BUFFER_OVERFLOW
  12: IMPULSE_VM_ERR_FLOATING_POINT
  13: IMPULSE_VM_ERR_GAS_EXHAUSTED
  14: IMPULSE_VM_ERR_TYPE_MISMATCH
  15: IMPULSE_VM_ERR_VALIDATION_FAILED

opcodes:
  # --- Pillar 1: System, Constants, Scalar ALU & Windowed Control (0x00 - 0x14) ---
  - code: 0x00
    name: OP_HALT
    mnemonic: HALT
    pillar: 1
    allowed_flags: 0x0
    morsel_role: forbidden
    banks: { dst: NONE, s1: NONE, s2: NONE, s3: NONE }
    imm_layout: NONE
    sets_vm_flags: []
    subops: { 0: ok }

  - code: 0x01
    name: OP_NOP
    mnemonic: NOP
    pillar: 1
    allowed_flags: 0x0
    morsel_role: body_ok
    banks: { dst: NONE, s1: NONE, s2: NONE, s3: NONE }
    imm_layout: NONE
    sets_vm_flags: []
    subops: { 0: nop }

  - code: 0x02
    name: OP_TRAP
    mnemonic: TRAP
    pillar: 1
    allowed_flags: 0x0
    morsel_role: forbidden
    banks: { dst: NONE, s1: NONE, s2: NONE, s3: NONE }

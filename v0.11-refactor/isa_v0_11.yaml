    banks: { dst: NONE, s1: SUBOP_DEP, s2: NONE, s3: NONE }
    imm_layout: U32
    sets_vm_flags: []
    subops: { 0: imm, 1: reg }

  - code: 0x04
    name: OP_ASSERT
    mnemonic: ASSERT
    pillar: 1
    allowed_flags: 0x0
    morsel_role: forbidden
    banks: { dst: NONE, s1: SUBOP_DEP, s2: NONE, s3: NONE }
    imm_layout: U32
    sets_vm_flags: []
    subops:
      0: true_r
      1: nonempty_f
      2: empty_f
      3: zf_set
      4: zf_clear
      5: st_set
      6: not_null_r
      7: is_null_r

  - code: 0x05
    name: OP_LOAD_CONST
    mnemonic: LOAD_CONST
    pillar: 1
    allowed_flags: 0x8
    morsel_role: forbidden
    banks: { dst: R, s1: NONE, s2: NONE, s3: NONE }
    imm_layout: CONST_PAYLOAD

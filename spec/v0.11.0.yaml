      IMPULSE_ERR_UNSUPPORTED_VERSION: 2
      IMPULSE_ERR_UNSUPPORTED_GLOBAL_FEATURE: 3
      IMPULSE_ERR_UNSUPPORTED_SECTION_FEATURE: 4

      IMPULSE_ENC_HYBRID_16_32: 0x03
      IMPULSE_ENC_SIMDCOMP: 0x04
      IMPULSE_ENC_SLICED_ELLPACK: 0x05
      IMPULSE_ENC_TPU_BCOO: 0x06
      IMPULSE_ENC_RAW_UINT64: 0x07
      IMPULSE_ENC_ROARING_BITMAP: 0x08

  impulse_coo_order_t:
    type: uint8
    doc: "COO Edge-List Physical Ordering Guarantee (Spec v0.11.0)"
    values:
      IMPULSE_COO_ORDER_UNSORTED: 0x00
      IMPULSE_COO_ORDER_SRC: 0x01
      IMPULSE_COO_ORDER_SRC_TGT: 0x02
      IMPULSE_COO_ORDER_TGT: 0x03
      IMPULSE_COO_ORDER_TGT_SRC: 0x04

  impulse_attr_type_t:
    type: uint8
    doc: "Attribute Base Primitive Type Enums (bits 0..6; bit 7 = 0x80 nullable flag)"
    values:
      IMPULSE_ATTR_TYPE_INT8: 0x01
      IMPULSE_ATTR_TYPE_INT16: 0x02
      IMPULSE_ATTR_TYPE_INT32: 0x03
      IMPULSE_ATTR_TYPE_INT64: 0x04
      IMPULSE_ATTR_TYPE_FLOAT16: 0x05
      IMPULSE_ATTR_TYPE_FLOAT32: 0x06
      IMPULSE_ATTR_TYPE_FLOAT64: 0x07
      IMPULSE_ATTR_TYPE_TIMESTAMP_MS: 0x08
      IMPULSE_ATTR_TYPE_TIMESTAMP_NS: 0x09
      IMPULSE_ATTR_TYPE_FIXED_BYTES: 0x0A
      IMPULSE_ATTR_TYPE_VAR_STRING: 0x0B

# impulse-graph-spec/spec/v0.11.0.yaml
version: "0.11.0"
version_major: 0
version_minor: 11
magic: 0x494D5053  # 'IMPS'
header_baseline_offset: 4096

enums:
  impulse_status_t:
    type: uint32

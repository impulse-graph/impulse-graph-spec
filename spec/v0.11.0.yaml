      IMPULSE_ATTR_TYPE_UINT8: 0x11
      IMPULSE_ATTR_TYPE_UINT16: 0x12
      IMPULSE_ATTR_TYPE_UINT32: 0x13
      IMPULSE_ATTR_TYPE_UINT64: 0x14
      IMPULSE_ATTR_TYPE_DECIMAL64: 0x15
      # 0x16 reserved for future DECIMAL128 (int128_t, 19 <= P <= 38)

  impulse_index_type_t:
    type: uint8
    doc: "Generic Secondary Index Type Enums"
    values:

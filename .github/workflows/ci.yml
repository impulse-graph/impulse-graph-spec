name: Impulse Graph Specification & Opcode Coverage CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-spec-and-vectors:
    name: Validate Spec & Enforce 100% Opcode Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout impulse-graph-spec
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml pytest

      - name: Verify Specification YAML & Contracts JSON
        run: |
          if [ -f spec/v0.9.0.yaml ]; then
            python -c "import yaml, json; yaml.safe_load(open('spec/v0.9.0.yaml')); json.load(open('tools/contracts.json'))"
            echo "SUCCESS: spec/v0.9.0.yaml and tools/contracts.json are valid"
          else
            echo "ERROR: spec/v0.9.0.yaml not found!"
            exit 1
          fi

      - name: Validate ImpAsm Test Vectors & Enforce 100% Opcode Coverage
        run: |
          python tools/run_vm_asm_suite.py

